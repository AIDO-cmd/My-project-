<!doctype html>
<html>
  <head>
    <title>Subjects</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }
      body {
        display: flex;
        background: #f4f6f9;
      }

      .sidebar {
        width: 250px;
        height: 100vh;
        background: #1f2937;
        color: #fff;
        padding: 20px;
        position: fixed;
      }
      .sidebar a {
        display: block;
        color: #fff;
        text-decoration: none;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
      }
      .sidebar a:hover {
        background: #374151;
      }

      .main {
        margin-left: 250px;
        width: calc(100% - 250px);
      }
      .topbar {
        height: 70px;
        background: #fff;
        border-left: 5px solid #4353e9;
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .content {
        padding: 20px;
      }

      .card {
        background: #fff;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
      }
      .btn {
        background: #4353e9;
        color: #fff;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>Admin</h2>
      <a href="subjects.html">Subjects</a>
    </div>

    <div class="main">
      <div class="topbar"><h3>Subjects</h3></div>

      <div class="content">
        <button class="btn">+ Add Subject</button>

        <div class="card">Mathematics</div>
        <div class="card">English</div>
        <div class="card">Science</div>
      </div>
    </div>
  </body>
</html>
